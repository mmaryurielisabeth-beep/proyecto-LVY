<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Para mamá Ana</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <div id="estrellas"></div>

    <div id="corazones"></div>


    <div class="universo">

        <div class="orbita orbita1"></div>

        <div class="orbita orbita2"></div>

        <div class="orbita orbita3"></div>

        <div class="corazon-central">
            ❤️
        </div>

    </div>


    <div class="mensaje">

        <p class="pequeno">
            UNA SORPRESA PARA ALGUIEN MUY ESPECIAL
        </p>

        <h1>
            Para mamá <span>ANA</span>
        </h1>

        <p id="texto"></p>

        <button onclick="abrirSorpresa()">
            Abrir sorpresa ❤️
        </button>

    </div>


    <div id="sorpresa" class="sorpresa">

        <div class="tarjeta">

            <button
                class="cerrar"
                onclick="cerrarSorpresa()">
                ×
            </button>

            <div class="gran-corazon">
                ❤️
            </div>

            <h2>
                Para mi mamá Ana
            </h2>

            <p>
                Gracias por estar siempre conmigo,
                por cuidarme, apoyarme y quererme.
            </p>

            <p>
                Eres una persona muy importante
                en mi vida.
            </p>

            <h3>
                Te quiero mucho, mamá. 💙🩷
            </h3>

        </div>

    </div>

<audio id="musica" src="musica.mp3"></audio>

    <script src="script.js"></script>

</body>

</html>
